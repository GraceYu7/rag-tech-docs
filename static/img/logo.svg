<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>黄玫瑰</title>
  <desc>一朵没有花茎的黄玫瑰</desc>

  <defs>
    <!-- 外层花瓣渐变 -->
    <radialGradient id="outerPetal" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="45%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F9A825"/>
    </radialGradient>

    <!-- 中层花瓣渐变 -->
    <radialGradient id="midPetal" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="50%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </radialGradient>

    <!-- 内层花瓣渐变 -->
    <radialGradient id="innerPetal" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </radialGradient>

    <!-- 花心渐变 -->
    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>

    <!-- 柔和阴影 -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3"
                    flood-color="#B8860B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g transform="translate(120 120)"
     filter="url(#softShadow)"
     stroke-linejoin="round">

    <!-- 外层花瓣：6 片 -->
    <g fill="url(#outerPetal)" stroke="#DAA520" stroke-width="1.2" stroke-opacity="0.6">
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(0)"/>
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(60)"/>
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(120)"/>
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(180)"/>
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(240)"/>
      <path d="M0,0 C-42,-8 -62,-58 -22,-96 C18,-62 28,-18 0,0 Z" transform="rotate(300)"/>
    </g>

    <!-- 中层花瓣：5 片 -->
    <g fill="url(#midPetal)" stroke="#E6A700" stroke-width="1" stroke-opacity="0.5">
      <path d="M0,0 C-34,-6 -50,-46 -18,-76 C14,-48 22,-14 0,0 Z" transform="rotate(36)"/>
      <path d="M0,0 C-34,-6 -50,-46 -18,-76 C14,-48 22,-14 0,0 Z" transform="rotate(108)"/>
      <path d="M0,0 C-34,-6 -50,-46 -18,-76 C14,-48 22,-14 0,0 Z" transform="rotate(180)"/>
      <path d="M0,0 C-34,-6 -50,-46 -18,-76 C14,-48 22,-14 0,0 Z" transform="rotate(252)"/>
      <path d="M0,0 C-34,-6 -50,-46 -18,-76 C14,-48 22,-14 0,0 Z" transform="rotate(324)"/>
    </g>

    <!-- 内层花瓣：4 片 -->
    <g fill="url(#innerPetal)" stroke="#F9A825" stroke-width="0.9" stroke-opacity="0.45">
      <path d="M0,0 C-24,-4 -36,-34 -13,-56 C10,-35 16,-10 0,0 Z" transform="rotate(18)"/>
      <path d="M0,0 C-24,-4 -36,-34 -13,-56 C10,-35 16,-10 0,0 Z" transform="rotate(108)"/>
      <path d="M0,0 C-24,-4 -36,-34 -13,-56 C10,-35 16,-10 0,0 Z" transform="rotate(198)"/>
      <path d="M0,0 C-24,-4 -36,-34 -13,-56 C10,-35 16,-10 0,0 Z" transform="rotate(288)"/>
    </g>

    <!-- 最内层小花瓣 -->
    <g fill="url(#centerGrad)" stroke="#F57F17" stroke-width="0.8" stroke-opacity="0.6">
      <path d="M0,0 C-14,-2 -22,-20 -8,-34 C6,-21 10,-6 0,0 Z" transform="rotate(0)"/>
      <path d="M0,0 C-14,-2 -22,-20 -8,-34 C6,-21 10,-6 0,0 Z" transform="rotate(90)"/>
      <path d="M0,0 C-14,-2 -22,-20 -8,-34 C6,-21 10,-6 0,0 Z" transform="rotate(180)"/>
      <path d="M0,0 C-14,-2 -22,-20 -8,-34 C6,-21 10,-6 0,0 Z" transform="rotate(270)"/>
    </g>

    <!-- 中心花蕊 -->
    <circle cx="0" cy="0" r="7" fill="#FFB300" stroke="#F57F17" stroke-width="1"/>
    <circle cx="-2" cy="-2" r="3" fill="#FFE082" opacity="0.9"/>
  </g>
</svg>